# Каталог источников исходных данных для градостроительных проверок.
# Узлы графа типа "data". Правится руками.
#
# id        — короткий стабильный идентификатор (латиница/подчёркивание), используется в связи.yaml
# название  — как показывать на графе
# группа    — для раскраски/группировки: заявление | тэп | гпзу | геоданные | ifc | модели | документы | внешние | производные
# формат    — носитель
# описание  — одна-две строки
# см        — ссылка на раздел хаба SOURCE/Извлечение данных (Градостроительство).md, если есть

источники:
  - id: ЗАЯВЛЕНИЕ
    название: Заявление АГР / стартовая форма
    группа: заявление
    формат: json / электронная форма
    описание: >
      Поля формы заявления: цель обращения, категория и назначение объекта,
      источник финансирования, планируемые работы (новое строительство / реконструкция),
      способ получения результата. Первичный источник признаков применимости почти всех проверок.
    см: "Тип и категория объекта"

  - id: ТЭП
    название: Ведомость ТЭП (XML)
    группа: тэп
    формат: xml
    описание: >
      Машиночитаемые технико-экономические показатели объекта: площади, этажность,
      мощность/вместимость, число квартир. Корневой узел ArchitecturalUrbanPlanningSolution.
    см: "Технико-экономические показатели (ТЭП)"

  - id: ГПЗУ_ПАРАМ
    название: ГПЗУ — предельные параметры (текст)
    группа: гпзу
    формат: pdf / скан / xml
    описание: >
      Текстовая часть ГПЗУ: предельная площадь участка, отступы, высотность, процент застройки,
      ширина по фронту улицы. Единого машиночитаемого формата нет — парсинг/OCR либо XML «сведения».
    см: "ГПЗУ — текстовая часть (таблица предельных параметров)"

  - id: ГПЗУ_ГЕО
    название: ГПЗУ — графическая часть / сведения
    группа: гпзу
    формат: pdf / xml / dwg
    описание: >
      Чертёж ГПЗУ и координатные сведения: красные линии, границы зон допустимого размещения,
      охранные зоны. Воспроизводит красные линии из ППТ.

  - id: ППТ
    название: Проект планировки / межевания территории (ППТ/ПМТ)
    группа: документы
    формат: pdf / dwg
    описание: >
      Утверждённый ППТ/ПМТ — первоисточник красных линий и линий градостроительного
      регулирования, если утверждён для территории.

  - id: ГЗК
    название: Решение ГЗК
    группа: документы
    формат: протокол / pdf
    описание: >
      Решение Градостроительно-земельной комиссии: целевые значения ТЭП, с которыми
      сверяется рассчитанное по модели (цель ЦИМ АГР).

  - id: КЛАССИФИКАТОР
    название: Классификатор МССК 5.0
    группа: документы
    формат: справочник
    описание: >
      Эталонные коды видов объектов, помещений/зон и элементов. Поиск любого объекта
      проверки — по сочетанию «код МССК + наименование».

  - id: IFC_МОДЕЛЬ
    название: IFC-модель (АР / ПС / БиО)
    группа: ifc
    формат: ifc (zip-пакет)
    описание: >
      Цифровая модель: IfcSpace / IfcWall / IfcDoor / IfcWindow / IfcSlab / IfcRailing и т. д.,
      пользовательские атрибуты RUS_* (RUS_MSSK_*_Code, RUS_Name, RUS_Height), геометрия,
      пространственные связи (IfcRelSpaceBoundary, IfcRelVoidsElement).

  - id: IFC_РЕЗУЛЬТАТ
    название: Результаты IFC-проверок (callback)
    группа: производные
    формат: json
    описание: >
      Итог работы ВПМ/НПМ/IFC-чекера, передаётся сервису град-проверок. «Декоратор»:
      какие IFC-проверки должны быть пройдены до запуска данной ГР-проверки.

  - id: НПМ_ВПМ
    название: Модели НПМ / ВПМ (FBX)
    группа: модели
    формат: fbx (zip)
    описание: >
      Низко- и высокополигональные модели объекта и благоустройства. Источник геометрии
      там, где нет IFC либо проверка «по форме».

  - id: БУКЛЕТ
    название: Буклет / проектные материалы (PDF)
    группа: документы
    формат: pdf
    описание: >
      Схемы ситуационного плана, СПОЗУ, фасадов, планов этажей, разрезов, размещения вывесок.
      Для визуальной сверки и проверок комплектности/содержания.

  - id: DWG
    название: Чертежи DWG / СПОЗУ (слои)
    группа: документы
    формат: dwg
    описание: >
      Векторные чертежи с именованными слоями (тротуары, проезды, озеленение, площадки,
      препятствия). Коды СПОЗУ вида «ПО ЗУ NN NN NN».

  - id: ГЕОДАННЫЕ
    название: Геоданные проекта (GeoJSON / GPKG)
    группа: геоданные
    формат: geojson / gpkg
    описание: >
      Пространственные слои проекта: границы, зоны, покрытия, площадки. Ситуационный план
      территории проектирования предоставляется в gpkg.

  - id: КРАСНЫЕ_ЛИНИИ
    название: Красные линии УДС
    группа: производные
    формат: полигон (МСК Москвы)
    описание: >
      Полигон территории общего пользования / УДС снаружи красной линии (код ПО ЗУ 13 20 02).
      Приоритет источников: ППТ → ГПЗУ → геоданные-слой.
    см: "Красные линии улично-дорожной сети"

  - id: ГРАНИЦА_ЗУ
    название: Граница земельного участка
    группа: производные
    формат: полигон (МСК Москвы)
    описание: >
      Полигон границ ЗУ. Приоритет: ЕГРН/КПТ → ГПЗУ → геоданные/DWG-слой.
      Собственного кода МССК нет.
    см: "Граница земельного участка"

  - id: ПЯТНО
    название: Контур пятна застройки
    группа: производные
    формат: полигон (МСК Москвы)
    описание: >
      Объединение горизонтальных проекций всех надземных и подземных частей здания
      (до низа фундаментной плиты). Строится из IFC / DWG (ПО ЗУ 10 20 01 + 10 20 03) / FBX.
    см: "Контур пятна застройки"

  - id: ЕГРН
    название: ЕГРН / Росреестр / КПТ
    группа: внешние
    формат: выписка / API
    описание: Первичный юридический источник границ и кадастровых характеристик участка.

  - id: ПЗЗ
    название: Правила землепользования и застройки (ПЗЗ)
    группа: внешние
    формат: gisogd.mos.ru (только снятие с экрана)
    описание: >
      API на gisogd.mos.ru отсутствует. Блокирует проверки, которым нужны
      градостроительные регламенты территориальных зон (напр. ГР-16).

  - id: МОСДАТА
    название: МосДата / K2 (городские данные)
    группа: внешние
    формат: платформа
    описание: >
      Городские слои: озеленение и природные территории, транспорт и остановки,
      социальные объекты, каркасы улиц и парковок. Часть — этап 2+.

  - id: ЗЕЛФОНД
    название: Слои природных и озеленённых территорий
    группа: внешние
    формат: городские слои
    описание: >
      ООПТ, зелёный фонд, озеленённые территории общего пользования. Источник/формат
      для ряда проверок пока не зафиксирован.
