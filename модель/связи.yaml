# Ручная разметка рёбер графа зависимостей ГР-проверок.
# build.py берёт узлы и базовые рёбра «проверка→данные» из таблицы автоматически
# (по колонке «Формат», флагам «МосДата» / «Нужен результат IFC»), а ЗДЕСЬ лежат
# уточнения, которые из таблицы не вывести: конкретные источники данных и связи
# проверок между собой. Это живой файл — дополняйте по мере разбора аналитики.
#
# Формат записи:
#
#   проверки:
#     ГР-53:
#       критерий: "..."              # переопределить подпись, если в таблице пусто/криво
#       примечание: "..."            # короткая заметка, видна в панели узла
#       данные: [КРАСНЫЕ_ЛИНИИ, ПЯТНО]        # id из источники-данных.yaml (добавляются к авто)
#       зависит_от:
#         - {проверка: ГР-70, тип: переиспользование, примечание: "тот же контур пятна застройки"}
#       требует_ifc: [IFC-65-66, IFC-88.1]    # IFC-проверки, которые должны быть пройдены заранее
#
# Тип связи «зависит_от» (влияет на стиль ребра):
#   результат          — жёсткая зависимость: берёт вычисленное значение другой проверки
#   переиспользование  — общий подготовленный источник данных / геометрия
#   предпроверка       — должна отработать раньше и определить применимость
#   вариант            — та же проверка в другой системе координат / другом приложении
#   родственная        — один блок критериев, общего расчёта нет

# Короткие названия приложений 1423-ПП — вместо «Приложение N» в фильтре,
# в панели узла и как заголовки групп в раскладке «по приложениям».
