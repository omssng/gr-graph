# Файлы аналитики для нестандартных / групповых имён.
файлы_аналитики:
  ГР-53: "OBSIDIAN/Град. проверки/Аналитика/ГР - 53, 71.md"
  ГР-71: "SOURCE/ГР - 71.md"
  ГР-113: "OBSIDIAN/Град. проверки/Аналитика/ГР - 113-114.md"
  ГР-114: "OBSIDIAN/Град. проверки/Аналитика/ГР - 113-114.md"
  ГР-147: "OBSIDIAN/Град. проверки/Аналитика/ГР - 147 и 156.md"
  ГР-156: "OBSIDIAN/Град. проверки/Аналитика/ГР - 147 и 156.md"
  ГР-148: "OBSIDIAN/Град. проверки/Аналитика/ГР - 148 и 149 и 157.md"
  ГР-149: "OBSIDIAN/Град. проверки/Аналитика/ГР - 148 и 149 и 157.md"
  ГР-157: "OBSIDIAN/Град. проверки/Аналитика/ГР - 148 и 149 и 157.md"

проверки:

  # --- Красные линии / пятно застройки / граница участка (Прил. 2) --------------
  ГР-18:
    примечание: "Площадь ЗУ ≤ предельной по ГПЗУ. Полигон границы ЗУ — тот же, что в ГР-70."
    данные: [ГРАНИЦА_ЗУ, ГПЗУ_ПАРАМ, ЕГРН]
    зависит_от:
      - {проверка: ГР-70, тип: переиспользование, примечание: "общий полигон границы ЗУ (кадастр/ГПЗУ)"}

  ГР-53:
    примечание: "Пересечение пятна застройки с красными линиями. Базовая геометрическая проверка группы."
    данные: [ПЯТНО, КРАСНЫЕ_ЛИНИИ, ГЕОДАННЫЕ]
    зависит_от:
      - {проверка: ГР-70, тип: переиспользование, примечание: "контур пятна застройки и граница участка"}
      - {проверка: ГР-71, тип: вариант, примечание: "ГР-71 — та же проверка в МСК-77"}
      - {проверка: ГР-142, тип: родственная}
      - {проверка: ГР-117, тип: родственная}
      - {проверка: ГР-144, тип: родственная}

  ГР-70:
    примечание: "Все характерные точки здания — внутри границы участка."
    данные: [ПЯТНО, ГРАНИЦА_ЗУ, ЕГРН, ГЕОДАННЫЕ]
    зависит_от:
      - {проверка: ГР-53, тип: родственная}
      - {проверка: ГР-117, тип: родственная}

  ГР-71:
    примечание: "= ГР-53, но геометрия сверяется в МСК-77."
    данные: [ПЯТНО, КРАСНЫЕ_ЛИНИИ, ГЕОДАННЫЕ]
    зависит_от:
      - {проверка: ГР-53, тип: вариант}
      - {проверка: ГР-70, тип: переиспользование, примечание: "контур пятна застройки"}
      - {проверка: ГР-18, тип: родственная}
      - {проверка: ГР-142, тип: родственная}
      - {проверка: ГР-144, тип: родственная}

  ГР-142:
    примечание: "Фронт улиц: отступ застройки по фронту улично-дорожной сети."
    данные: [ПЯТНО, КРАСНЫЕ_ЛИНИИ, ГПЗУ_ПАРАМ, ППТ]
    зависит_от:
      - {проверка: ГР-53, тип: переиспользование, примечание: "общий контур пятна и красные линии"}
      - {проверка: ГР-143, тип: родственная}
      - {проверка: ГР-144, тип: родственная}

  ГР-144:
    примечание: "Выступ конструктивных элементов ОКС за красные линии (в т. ч. подземная часть)."
    данные: [КРАСНЫЕ_ЛИНИИ, ПЯТНО, IFC_МОДЕЛЬ]
    зависит_от:
      - {проверка: ГР-142, тип: переиспользование, примечание: "красные линии и контур застройки"}

  ГР-117:
    примечание: "Схема планировочной организации ЗУ — общий поставщик геометрии участка/застройки."
    данные: [DWG, ГЕОДАННЫЕ, ПЯТНО, ГРАНИЦА_ЗУ]

  # --- Парковки жилой группы (Прил. 5) -----------------------------------------
  ГР-60:
    примечание: "Nп = (S/S1)·A·K1 — места постоянного размещения ТС жителей. Базовый расчёт семьи 60–69."
    данные: [ТЭП, ЗАЯВЛЕНИЕ, МОСДАТА]
    зависит_от:
      - {проверка: ГР-61, тип: родственная}
      - {проверка: ГР-62, тип: родственная}
      - {проверка: ГР-63, тип: родственная}
      - {проверка: ГР-64, тип: родственная}

  ГР-61:
    примечание: "Места гостевой парковки — доля от Nп."
    данные: [ТЭП, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-60, тип: результат, примечание: "использует Nп, не пересчитывает"}
      - {проверка: ГР-62, тип: родственная}
      - {проверка: ГР-63, тип: родственная}
      - {проверка: ГР-64, тип: родственная}

  ГР-62:
    данные: [ТЭП, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-60, тип: результат, примечание: "производно от Nп"}

  ГР-63:
    данные: [ТЭП, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-60, тип: результат, примечание: "производно от Nп"}

  ГР-64:
    данные: [ТЭП, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-60, тип: результат, примечание: "производно от Nп"}

  # --- Объекты образования (Прил. 7) -----------------------------------------
  ГР-137:
    примечание: "Парапет + сетчатое ограждение на эксплуатируемой кровле с детской/спортплощадкой."
    данные: [IFC_МОДЕЛЬ, КЛАССИФИКАТОР]
    зависит_от:
      - {проверка: ГР-140, тип: родственная}
      - {проверка: ГР-141, тип: родственная}

  ГР-140:
    примечание: "Тамбур дошкольных зданий: глубина, ширина, естественное освещение."
    данные: [IFC_МОДЕЛЬ, КЛАССИФИКАТОР, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-141, тип: родственная}
      - {проверка: ГР-134, тип: родственная}
      - {проверка: ГР-135, тип: родственная}
      - {проверка: ГР-136, тип: родственная}

  ГР-141:
    примечание: "КПП/входная группа у въезда. Точки въезда на территорию — общая геометрия с ГР-132/140."
    данные: [IFC_МОДЕЛЬ, КЛАССИФИКАТОР, ТЭП, ГЕОДАННЫЕ]
    зависит_от:
      - {проверка: ГР-140, тип: переиспользование, примечание: "геометрия точек въезда на территорию"}
      - {проверка: ГР-132, тип: переиспользование, примечание: "та же геометрия въездов"}

  # --- Реновация (Прил. 9) --------------------------------------------------
  ГР-145:
    примечание: "Вариативность планировки квартир: раздел документации ИЛИ ненесущая перегородка кухня↔комната."
    данные: [IFC_МОДЕЛЬ, КЛАССИФИКАТОР, БУКЛЕТ, ЗАЯВЛЕНИЕ]
    зависит_от:
      - {проверка: ГР-146, тип: родственная}
      - {проверка: ГР-147, тип: родственная}

  # --- Жильё за счёт бюджета Москвы (Прил. 10) -----------------------------
  ГР-154:
